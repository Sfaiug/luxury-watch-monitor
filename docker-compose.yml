version: '3.8'

services:
  watch-monitor:
    build: .
    container_name: watch-monitor
    environment:
      - PYTHONUNBUFFERED=1
      - SEEN_WATCHES_FILE=/app/data/seen_watches.json
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./session_history.json:/app/session_history.json
      - ./.env:/app/.env
    restart: unless-stopped
    networks:
      - watch-network

networks:
  watch-network:
    driver: bridge